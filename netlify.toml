[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Shared links encode their state in the query string, which Netlify forwards.
# Keep old immutable assets available for already-installed offline clients.
[[redirects]]
  from = "/"
  to = "https://dacurse.github.io/gtnh-recipe-browser/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://dacurse.github.io/gtnh-recipe-browser/"
  status = 301
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/versions.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/versions-v7.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
